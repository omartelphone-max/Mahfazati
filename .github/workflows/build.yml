name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Fix nativeCanvas
        run: |
          unzip Mahfazati-AndroidStudio-Project.zip -d app-src
          FILE="app-src/Mahfazati/app/src/main/java/com/mahfazati/app/ui/Components.kt"
          grep -q "import androidx.compose.ui.graphics.nativeCanvas" "$FILE" || sed -i '1i import androidx.compose.ui.graphics.nativeCanvas' "$FILE"
          cat "$FILE" | head -n 20
      - name: Build APK
        run: |
          cd app-src/Mahfazati
          gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mahfazati-APK
          path: app-src/Mahfazati/app/build/outputs/apk/debug/app-debug.apk
